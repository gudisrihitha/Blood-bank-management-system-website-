</nav><div class="page-banner"><h1>Donor Registration</h1><p>Register and become part of our donor community.</p></div>
<section><div class="form-section"><div class="form-box"><h2>Registration Form</h2>
<form onsubmit="registerUser(event)">
<div class="two-col"><div><label>Full Name</label><input required type="text" placeholder="Full name"></div><div><label>Email</label><input required type="email" placeholder="Email"></div></div>
<div class="two-col"><div><label>Phone Number</label><input required type="tel" placeholder="Phone number"></div><div><label>Age</label><input required type="number" min="18" max="65" placeholder="Age"></div></div>
<label>Blood Group</label><select required><option value="">Select Blood Group</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select>
<label>Address</label><textarea required placeholder="Enter address"></textarea>
<label>Create Password</label><input required type="password" placeholder="Create password">
<label>Confirm Password</label><input id="confirmPassword" required type="password" placeholder="Confirm password">
<button class="btn" type="submit">Register</button></form></div></div></section>
<script>function registerUser(e){e.preventDefault();if(e.target.querySelectorAll('input[type=password]')[0].value!==document.getElementById('confirmPassword').value){alert('Passwords do not match!');return;}alert('Registration successful! You can now login.');window.location.href='login.html';}</script><footer>© 2026 LifeLink Blood Bank Management System | Educational Project</footer></body></html>
